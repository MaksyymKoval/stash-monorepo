name: makeupstash

services:
  postgres:
    image: postgres:18.6-alpine
    environment:
      POSTGRES_USER: app
      POSTGRES_PASSWORD: app
      POSTGRES_DB: makeupstash
    ports:
      - "54320:5432"
    volumes:
      - postgres:/var/lib/postgresql

  # S3-compatible storage for photos (used from stage 1). S3 API on :8333.
  seaweedfs:
    image: chrislusf/seaweedfs:4.53
    command: server -dir=/data -s3 -s3.port=8333
    environment:
      AWS_ACCESS_KEY_ID: makeupstash
      AWS_SECRET_ACCESS_KEY: makeupstash-secret
    ports:
      - "8333:8333"
    volumes:
      - seaweedfs:/data

volumes:
  postgres:
  seaweedfs:
